spring.application.name=skill-exchange

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillexchange}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:skilluser}
spring.datasource.password=${DB_PASSWORD:skillpass123}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}